<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRM Login | Meeqan Travel & Tours</title><link rel="stylesheet" href="assets/css/crm.css?v=20261018"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body data-page="login"><main class="login-wrap"><section class="login-card"><a class="brand" href="dashboard.html" style="padding:0 0 18px;border-bottom:1px solid var(--line);color:var(--ink)"><span class="brand-mark" style="background:var(--navy);color:#fff">M</span><span><strong>MEEQAN CRM</strong><small style="color:var(--muted)">TRAVEL & TOURS</small></span></a><h1>Sign in to your CRM</h1><p>Authorized staff access only.</p><form id="login-form"><div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" placeholder="you@company.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><div style="text-align:right;margin:-6px 0 14px"><a href="#" id="forgot-password">Forgot password?</a></div><button class="btn primary" type="submit">Sign in</button></form><form id="reset-form" hidden><div class="field"><label for="reset-email">Email address</label><input id="reset-email" type="email" autocomplete="email" placeholder="you@company.com"></div><button class="btn primary" type="submit">Send Password Reset Email</button><p id="reset-message" class="login-foot" role="status" aria-live="polite"></p><div style="text-align:center;margin-top:12px"><a href="#" id="back-login">Back to Login</a></div></form><form id="new-password-form" hidden><div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters"></div><div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat your new password"></div><button class="btn primary" type="submit">Update Password</button><p id="new-password-message" class="login-foot" role="status" aria-live="polite"></p></form><div class="login-foot">Authorized staff only. Your account must have an active CRM profile.</div></section></main><div class="toast" id="toast" role="status"></div><script src="assets/js/supabase-config.js?v=20261018"></script><script src="assets/js/crm.js?v=20261018"></script></body></html>
